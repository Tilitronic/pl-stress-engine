[package]
name = "builder"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"

[[bin]]
name = "builder"
path = "src/main.rs"

[dependencies]
bzip2 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"
ahash = "0.8"
anyhow = "1"
pl-stress-core = { path = "../core" }
