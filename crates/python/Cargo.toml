[package]
name = "pl-stress-python"
version = "0.2.0"
edition = "2021"
license = "AGPL-3.0-or-later"

[lib]
name = "polish_stress"
crate-type = ["cdylib"]

[dependencies]
pl-stress-core = { path = "../core" }
pyo3 = { version = "0.22", features = ["extension-module"] }
once_cell = "1"

[profile.release]
opt-level = 3
lto = true
strip = true
